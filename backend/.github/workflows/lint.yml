name: Lint
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]" ruff mypy bandit
      - run: ruff check src/
      - run: ruff format --check src/
      - run: mypy --strict src/
      - run: bandit -r src/ -ll -q
