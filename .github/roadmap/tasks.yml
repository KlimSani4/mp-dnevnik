  - title: "Итоговые оценки из зачётной книжки"
    phase: 3
    labels: ["type: feature", "area: integrations", "size: L"]
    body: |
      Только через официальный доступ, без хранения паролей студентов.

  - title: "Подтягивание расписания проектной деятельности"
    phase: 3
    labels: ["type: feature", "area: integrations", "size: M"]

  - title: "Интегрировать расписание физкультуры"
    phase: 3
    labels: ["type: feature", "area: integrations", "size: M"]

  - title: "Интеграция с ДПО"
    phase: 3
    labels: ["type: feature", "area: integrations", "size: L"]

