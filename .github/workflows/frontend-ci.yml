name: Frontend CI

on:
  push:
    branches: [main]
    paths: ["frontend/**", ".github/workflows/frontend-ci.yml"]
  pull_request:
    paths: ["frontend/**", ".github/workflows/frontend-ci.yml"]

defaults:
  run:
    working-directory: frontend

jobs:
  typecheck-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @nexora/shared typecheck
      - run: pnpm --filter @nexora/desktop typecheck
      - run: pnpm --filter @nexora/desktop build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Сборка образа без публикации
        uses: docker/build-push-action@v5
        with:
          context: frontend
          push: false
          build-args: |
            VITE_API_URL=https://nexora.digitaldrugs.tech/api/v1
            VITE_TELEGRAM_BOT_USERNAME=nexora_mpu_bot
