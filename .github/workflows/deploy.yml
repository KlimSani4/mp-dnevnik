name: Deploy

# Сборка и публикация образов в ghcr.io после merge в main.
# Keel в кластере опрашивает тег latest раз в минуту и перезапускает поды.
# Миграции БД бэкенд применяет сам при старте (backend/entrypoint.sh).

on:
  push:
    branches: [main]
    paths: ["backend/**", "frontend/**", ".github/workflows/deploy.yml"]
  workflow_dispatch:
    inputs:
      target:
        description: "Что собрать"
        type: choice
        options: [all, backend, frontend]
        default: all

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/klimsani4

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.pick.outputs.backend }}
      frontend: ${{ steps.pick.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - id: filter
        if: github.event_name == 'push'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - "backend/**"
              - ".github/workflows/deploy.yml"
            frontend:
              - "frontend/**"
              - ".github/workflows/deploy.yml"
      - id: pick
        env:
          EVENT: ${{ github.event_name }}
          TARGET: ${{ inputs.target }}
          BACKEND: ${{ steps.filter.outputs.backend }}
          FRONTEND: ${{ steps.filter.outputs.frontend }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            BACKEND=false; FRONTEND=false
            case "$TARGET" in
              all) BACKEND=true; FRONTEND=true ;;
              backend) BACKEND=true ;;
              frontend) FRONTEND=true ;;
            esac
          fi
          echo "backend=${BACKEND:-false}" >> "$GITHUB_OUTPUT"
          echo "frontend=${FRONTEND:-false}" >> "$GITHUB_OUTPUT"

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v5
        with:
          context: backend
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/nexora-backend:latest
            ${{ env.IMAGE_PREFIX }}/nexora-backend:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: Итог
        run: echo "Опубликован \`nexora-backend:${{ github.sha }}\` и \`latest\`" >> "$GITHUB_STEP_SUMMARY"

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v5
        with:
          context: frontend
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/nexora-frontend:latest
            ${{ env.IMAGE_PREFIX }}/nexora-frontend:${{ github.sha }}
          build-args: |
            VITE_API_URL=https://nexora.digitaldrugs.tech/api/v1
            VITE_TELEGRAM_BOT_USERNAME=nexora_mpu_bot
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
      - name: Итог
        run: echo "Опубликован \`nexora-frontend:${{ github.sha }}\` и \`latest\`" >> "$GITHUB_STEP_SUMMARY"
