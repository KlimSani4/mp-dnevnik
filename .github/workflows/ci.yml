name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - "backend/**"
              - ".github/workflows/ci.yml"
            frontend:
              - "frontend/**"
              - ".github/workflows/ci.yml"

  backend-lint:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]" ruff mypy bandit
      - run: ruff check src/
      - run: ruff format --check src/
      - run: mypy --strict src/
      - run: bandit -r src/ -ll -q

  backend-audit:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -U pip pip-audit
      - run: pip install -e .
      # Исключения разобраны в docs/security-audit.md (п. «Зависимости»):
      # PYSEC-2026-4298 (python-jose) — алгоритм в decode_token задан явно, подмена ключа невозможна;
      # PYSEC-2026-1325 (ecdsa) — подпись ECDSA не используется, только HS256.
      - run: pip-audit --ignore-vuln PYSEC-2026-4298 --ignore-vuln PYSEC-2026-1325

  backend-test:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nexora
          POSTGRES_PASSWORD: nexora
          POSTGRES_DB: nexora_test
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 3s --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://nexora:nexora@localhost:5432/nexora_test
      REDIS_URL: redis://localhost:6379/0
      APP_SECRET_KEY: test-secret
      JWT_SECRET_KEY: test-jwt-secret
      TELEGRAM_BOT_TOKEN: fake-token-for-test
      APP_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[test]"
      - run: python -m alembic upgrade head
      - run: pytest --tb=short --ignore=tests/test_core/test_schedule_parser.py --ignore=tests/test_api

  backend-docker:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v5
        with:
          context: backend
          push: false

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @nexora/shared typecheck
      - run: pnpm --filter @nexora/desktop typecheck
      - run: pnpm --filter @nexora/desktop build
      - name: Аудит зависимостей (production, high и выше)
        run: pnpm audit --prod --audit-level high
      - name: Нет тестовых данных в production-сборке
        run: bash scripts/check-prod-bundle.sh

  frontend-docker:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v5
        with:
          context: frontend
          push: false
          build-args: |
            VITE_API_URL=https://nexora.digitaldrugs.tech/api/v1
            VITE_TELEGRAM_BOT_USERNAME=nexora_mpu_bot

  ci-passed:
    name: CI passed
    if: always()
    needs: [changes, backend-lint, backend-audit, backend-test, backend-docker, frontend, frontend-docker]
    runs-on: ubuntu-latest
    steps:
      - name: Проверить результаты
        run: |
          echo '${{ toJSON(needs) }}' | jq -e 'to_entries | all(.value.result == "success" or .value.result == "skipped")'
