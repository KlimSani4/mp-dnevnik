name: Backend CI

on:
  push:
    branches: [main]
    paths: ["backend/**", ".github/workflows/backend-ci.yml"]
  pull_request:
    paths: ["backend/**", ".github/workflows/backend-ci.yml"]

defaults:
  run:
    working-directory: backend

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]" ruff mypy bandit
      - run: ruff check src/
      - run: ruff format --check src/
      - run: mypy --strict src/
      - run: bandit -r src/ -ll -q

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nexora
          POSTGRES_PASSWORD: nexora
          POSTGRES_DB: nexora_test
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 3s --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://nexora:nexora@localhost:5432/nexora_test
      REDIS_URL: redis://localhost:6379/0
      APP_SECRET_KEY: test-secret
      JWT_SECRET_KEY: test-jwt-secret
      TELEGRAM_BOT_TOKEN: fake-token-for-test
      APP_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[test]"
      - run: python -m alembic upgrade head
      - run: pytest --cov=src --cov-report=xml --cov-report=term-missing --tb=short --ignore=tests/test_core/test_schedule_parser.py --ignore=tests/test_api
      - uses: codecov/codecov-action@v4
        with:
          files: backend/coverage.xml
          fail_ci_if_error: false

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Сборка образа без публикации
        uses: docker/build-push-action@v5
        with:
          context: backend
          push: false
