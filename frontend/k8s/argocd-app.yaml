apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nexora-frontend-dev
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/KlimSani4/mp-dnevnik.git
    targetRevision: main
    path: frontend/k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: nexora
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
