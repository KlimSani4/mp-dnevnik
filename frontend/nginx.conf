server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/snippets/security-headers.conf;

    # Gzip-сжатие для статики
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # Кэширование статических ресурсов (JS, CSS, изображения)
    location ~* \.(?:css|js|svg|png|jpg|jpeg|gif|ico|woff2?|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    # SPA-роутинг: все запросы, не совпавшие с файлами, отдаём index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Внутренние маршруты бота снаружи недоступны (#98)
    location ^~ /api/v1/internal/ {
        return 404;
    }

    # Проксирование API-запросов на бэкенд
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Проксирование health-check
    location /health {
        proxy_pass http://backend:8000;
    }
}
